# Shared settings of the preliminary learning book. The language-specific settings
# (title, chapters, output folder) are in the profiles _quarto-en.yml, _quarto-fr.yml
# and _quarto-pt.yml; `quarto render` renders the English version, and
# `py render.py` renders all languages.
project:
  type: book

profile:
  default: en
  group:
    - [en, fr, pt]

book:
  author: "Federica Giardina"
  date: today
  repo-url: https://github.com/Federica-Giardina/TIMERA-preparatory1
  repo-branch: main
  repo-actions: [issue]
  search: true
  downloads: [docx]

bibliography: references.bib

filters:
  - prep-refs.lua
  - docx-compat.lua
  - short-docx.lua

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    code-copy: true
    number-depth: 2
  docx:
    toc: true
    toc-depth: 2
    highlight-style: github

execute:
  freeze: auto
